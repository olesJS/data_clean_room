name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    name: Backend Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        working-directory: ./backend
        run: |
          ruff check .

      - name: Run Pytest
        working-directory: ./backend
        run: |
          pytest

  frontend-check:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Linter
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Test Build
        working-directory: ./frontend
        run: |
          npm run build

  docker-compose-check:
    name: Docker Compose Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from template
        run: |
          cp .env.example .env

      - name: Build and Start Services
        run: |
          docker compose up --build -d

      - name: Check Services Health & Logs
        run: |
          sleep 10
          docker compose ps
          curl --fail http://localhost:8000/health || (docker compose logs backend && exit 1)
          curl --fail http://localhost/ || (docker compose logs frontend && exit 1)

      - name: Shutdown Services
        if: always()
        run: |
          docker compose down -v